[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-audit"
version = "0.2.4"
description = "Security auditor for MCP server configurations."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Dan Calas"}]
keywords = ["mcp", "security", "audit", "prompt-injection", "supply-chain", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/calasdan-sketch/mcp-audit"
Issues = "https://github.com/calasdan-sketch/mcp-audit/issues"

[project.scripts]
mcp-audit = "mcp_audit.cli:main"

[tool.setuptools]
packages = ["mcp_audit"]

# Without this the wheel has no advisory feed and every known-vulnerable
# package reads as clean.
[tool.setuptools.package-data]
mcp_audit = ["advisories.json"]

[tool.ruff]
extend-exclude = [".venv-sop"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# short names and one-line lambdas in test helpers are fine
"tests/*" = ["E731", "E741"]
