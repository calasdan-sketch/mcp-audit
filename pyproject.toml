[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-audit"
version = "0.2.1"
description = "Security auditor for MCP server configurations."
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
mcp-audit = "mcp_audit.cli:main"

[tool.setuptools]
packages = ["mcp_audit"]

# Without this the wheel has no advisory feed and every known-vulnerable
# package reads as clean.
[tool.setuptools.package-data]
mcp_audit = ["advisories.json"]
