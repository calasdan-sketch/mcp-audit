[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-audit"
version = "0.3.0"
description = "Security auditor for MCP server configurations."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Calas Automations Inc." }]
keywords = ["mcp", "model-context-protocol", "security", "audit", "supply-chain",
            "prompt-injection", "claude", "cursor", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/calasdan-sketch/mcp-audit"
Issues = "https://github.com/calasdan-sketch/mcp-audit/issues"
Changelog = "https://github.com/calasdan-sketch/mcp-audit/blob/main/CHANGELOG.md"

[project.scripts]
mcp-audit = "mcp_audit.cli:main"

[tool.setuptools]
packages = ["mcp_audit"]

# Without this the wheel has no advisory feed and every known-vulnerable
# package reads as clean.
[tool.setuptools.package-data]
mcp_audit = ["advisories.json", "iocs.json"]
